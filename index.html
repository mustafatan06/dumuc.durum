<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d ü mü ç - Çok Yakında</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #030303; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; position: relative; padding: 20px; }
        
        /* ÇOK YOĞUN ALEV VE PATLAMA ARKA PLANI */
        .fire-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 120%, rgba(255, 69, 0, 0.5) 0%, rgba(255, 152, 0, 0.25) 40%, transparent 80%); z-index: 1; pointer-events: none; animation: intenseGlow 2.5s ease-in-out infinite alternate; }
        
        @keyframes intenseGlow {
            0% { opacity: 0.6; transform: scale(1); filter: brightness(1); }
            100% { opacity: 1; transform: scale(1.1); filter: brightness(1.4); }
        }

        /* ÇOKLU PATLAMA / PARLAMA KÜRELERİ */
        .explosion-orb { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,235,59,0.9) 0%, rgba(255,87,34,0.5) 45%, transparent 75%); z-index: 2; pointer-events: none; animation: explodeAnim 3s ease-in-out infinite; }
        
        @keyframes explodeAnim {
            0% { transform: scale(0.1); opacity: 0; }
            50% { opacity: 0.9; transform: scale(1.6); }
            100% { transform: scale(2.4); opacity: 0; }
        }

        /* MAKSİMUM SEVİYEDE UÇUŞAN KÖZ VE KIVILCIMLAR */
        .spark { position: absolute; background: #ffeb3b; border-radius: 50%; z-index: 3; pointer-events: none; box-shadow: 0 0 15px #ff5722, 0 0 30px #ff9800; animation: flyUp 2.5s linear infinite; }

        @keyframes flyUp {
            0% { transform: translateY(105vh) scale(0.2) rotate(0deg); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 0.95; }
            100% { transform: translateY(-10vh) scale(1.8) rotate(360deg); opacity: 0; }
        }

        /* ANA İÇERİK KUTUSU (MOBİL UYUMLU) */
        .container { position: relative; z-index: 10; text-align: center; max-width: 800px; padding: 40px 30px; width: 100%; background: rgba(14, 10, 8, 0.92); backdrop-filter: blur(15px); border: 1.5px solid rgba(255, 152, 0, 0.45); border-radius: 20px; box-shadow: 0 0 70px rgba(255, 87, 34, 0.4), inset 0 0 30px rgba(255, 152, 0, 0.2); animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-img { height: 75px; width: auto; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(255, 152, 0, 0.8)); animation: logoFloat 2.5s ease-in-out infinite alternate; }

        @keyframes logoFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-6px) scale(1.03); }
        }

        .badge { display: inline-block; background: linear-gradient(135deg, #ff9800, #ff3d00); color: #fff; padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 18px; box-shadow: 0 0 20px rgba(255, 61, 0, 0.6); animation: badgePulse 1.5s infinite; }

        @keyframes badgePulse {
            0% { box-shadow: 0 0 10px rgba(255,61,0,0.5); }
            50% { box-shadow: 0 0 25px rgba(255,152,0,0.9); }
            100% { box-shadow: 0 0 10px rgba(255,61,0,0.5); }
        }

        h1 { font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 15px; line-height: 1.3; text-shadow: 0 2px 15px rgba(0,0,0,0.9); }
        h1 span { background: linear-gradient(135deg, #ffeb3b, #ff5722); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 0 10px rgba(255,152,0,0.4)); }

        p { font-size: 1.1rem; color: #ddd; max-width: 600px; margin: 0 auto 25px auto; line-height: 1.6; }

        .contact-box { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, rgba(255,152,0,0.2), rgba(255,87,34,0.3)); border: 1.5px solid rgba(255, 152, 0, 0.6); padding: 13px 25px; border-radius: 30px; color: #ffbc00; font-weight: bold; text-decoration: none; transition: 0.3s; box-shadow: 0 4px 20px rgba(255,87,34,0.3); margin-bottom: 25px; word-break: break-word; }
        .contact-box:hover { background: linear-gradient(135deg, #ff9800, #ff3d00); color: #fff; transform: translateY(-3px); box-shadow: 0 6px 30px rgba(255, 87, 34, 0.6); }

        /* TAN MEDYA TASARIM İMZASI */
        .agency-credit { font-size: 0.75rem; color: #777; letter-spacing: 1px; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 15px; }
        .agency-credit span { color: #ff9800; font-weight: 700; }

        /* MOBİL UYUMLULUK AYARLARI */
        @media(max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 25px 15px; width: 100%; }
            h1 { font-size: 1.5rem; margin-bottom: 12px; }
            p { font-size: 0.95rem; margin-bottom: 20px; }
            .logo-img { height: 60px; margin-bottom: 15px; }
            .contact-box { padding: 12px 18px; font-size: 0.85rem; width: 100%; }
            .badge { font-size: 0.75rem; padding: 5px 14px; }
        }
    </style>
</head>
<body>

    <div class="fire-bg"></div>

    <!-- Dinamik Patlama, Parlama ve Köz Alanı -->
    <div id="effects-container"></div>

    <div class="container">
        <img src="logo.png" alt="Dümüç Logo" class="logo-img">
        <div><span class="badge"><i class="fa-solid fa-fire-flame-curved"></i> Çok Yakında Açılıyor</span></div>
        <h1>SABIRSIZLANDIĞINIZI BİLİYORUZ,<br><span>SİZİ ÇOK BEKLETMEYECEĞİZ!</span></h1>
        <p>Efsane lezzetler, gizli soslar ve unutulmaz dürümler çok yakında kapılarını açıyor. Hazırlıklarımız son sürat devam ediyor.</p>
        
        <div>
            <a href="tel:03123563000" class="contact-box"><i class="fa-solid fa-fire"></i> ÇOK YAKINDA DÜMÜÇLEMEYE BEKLİYORUZ!</a>
        </div>

        <div class="agency-credit">
            <span>TAN MEDYA TASARIM</span> TARAFINDAN KURULMAKTADIR.
        </div>
    </div>

    <script>
        const container = document.getElementById('effects-container');

        // Çok Yoğun Uçuşan Köz ve Kıvılcım Parçacıkları (Mobilde performans için 50, masaüstünde 80)
        const sparkCount = window.innerWidth < 768 ? 40 : 80;
        for (let i = 0; i < sparkCount; i++) {
            const spark = document.createElement('div');
            spark.classList.add('spark');
            
            const size = Math.random() * 6 + 2 + 'px';
            spark.style.width = size;
            spark.style.height = size;
            
            spark.style.left = Math.random() * 100 + 'vw';
            spark.style.animationDuration = (Math.random() * 2 + 1) + 's';
            spark.style.animationDelay = (Math.random() * 4) + 's';
            
            const colors = ['#ffeb3b', '#ff9800', '#ff5722', '#ff3d00', '#ffffff'];
            spark.style.background = colors[Math.floor(Math.random() * colors.length)];
            spark.style.boxShadow = `0 0 ${Math.random() * 12 + 6}px ${spark.style.background}`;

            container.appendChild(spark);
        }

        // Çoklu Rastgele Patlama / Parlama Küreleri
        const orbCount = window.innerWidth < 768 ? 4 : 8;
        for (let j = 0; j < orbCount; j++) {
            const orb = document.createElement('div');
            orb.classList.add('explosion-orb');
            
            const orbSize = (Math.random() * 200 + 100) + 'px';
            orb.style.width = orbSize;
            orb.style.height = orbSize;
            
            orb.style.left = Math.random() * 85 + 5 + 'vw';
            orb.style.top = Math.random() * 85 + 5 + 'vh';
            orb.style.animationDuration = (Math.random() * 2.5 + 1.5) + 's';
            orb.style.animationDelay = (Math.random() * 3) + 's';

            container.appendChild(orb);
        }
    </script>
</body>
</html>
